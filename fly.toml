# Fly.io-Konfiguration. Den App-Namen ggf. anpassen (muss weltweit eindeutig sein).
app = "herz-kreislauf-quiz"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # E-Mail-Adresse(n) für den Admin-Bereich (Komma-getrennt)
  ADMIN_EMAIL = "tara.hoffmann@gmx.net"

[http_service]
  internal_port = 3000
  force_https = true
  # Der Zustand liegt nur im Speicher → genau EINE Maschine verwenden (fly scale count 1).
  # Die Maschine schläft, wenn niemand verbunden ist, und wacht beim ersten Aufruf auf.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
