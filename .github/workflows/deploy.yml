name: Prüfen & Deployen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    # Deployt bei Push auf den Standard-Branch des Repos oder per Knopfdruck ("Run workflow")
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_HERZ }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Secrets prüfen
        id: pre
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::Secret FLY_API_TOKEN_HERZ ist nicht gesetzt – Deploy übersprungen."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          echo "app=$(sed -nE 's/^app *= *"([^"]+)".*/\1/p' fly.toml)" >> "$GITHUB_OUTPUT"

      - name: App auf Fly.io anlegen (nur beim ersten Mal)
        if: steps.pre.outputs.skip != '1'
        run: |
          APP="${{ steps.pre.outputs.app }}"
          if flyctl apps list --json | grep -q "\"Name\": *\"$APP\""; then
            echo "App $APP existiert bereits."
          else
            flyctl apps create "$APP" --org personal
          fi

      - name: Deploy
        if: steps.pre.outputs.skip != '1'
        run: flyctl deploy --remote-only --ha=false --app "${{ steps.pre.outputs.app }}"

      - name: Adresse anzeigen
        if: steps.pre.outputs.skip != '1'
        run: |
          echo "::notice::Live unter https://${{ steps.pre.outputs.app }}.fly.dev  (Admin: /admin)"
