# Demo-Fragensatz zum Ausprobieren der Technik.
# Die echten Fragen zu den Folien kommen in eigene Dateien (siehe _vorlage.yaml).
titel: Herz-Kreislauf – Demo

fragen:
  - folie: 1
    frage: Wie viele Kammern hat das menschliche Herz?
    antworten:
      - Zwei
      - Drei
      - Vier
      - Fünf
    richtig: C
    erklaerung: Zwei Vorhöfe (Atrien) und zwei Kammern (Ventrikel).

  - folie: 2
    frage: Welche Herzklappe liegt zwischen linkem Vorhof und linker Kammer?
    antworten:
      - Trikuspidalklappe
      - Mitralklappe
      - Pulmonalklappe
      - Aortenklappe
    richtig: B
    erklaerung: Die Mitralklappe (Bikuspidalklappe) trennt linken Vorhof und linke Kammer.

  - folie: 3
    frage: Welche Gefäße führen sauerstoffreiches Blut?
    antworten:
      - Aorta
      - Lungenarterien
      - Lungenvenen
      - Obere Hohlvene
    richtig: [A, C]
    erklaerung: Die Lungenvenen bringen sauerstoffreiches Blut zum Herzen, die Aorta verteilt es im Körper.
